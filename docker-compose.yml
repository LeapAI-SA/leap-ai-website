services:
  mongodb:
    image: mongo:7
    container_name: leap-mongodb
    restart: unless-stopped
    # Bind to localhost only — do not publish Mongo on all interfaces in production.
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: leap
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-leapsecret}
      MONGO_INITDB_DATABASE: leapai
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # mongosh can crash on Docker Desktop (V8); TCP check is reliable here
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: leap-redis
    restart: unless-stopped
    # No host port — backend uses redis://redis:6379 on the compose network.
    # Avoids conflict when another Redis (e.g. bab-redis) already uses :6379.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: leap-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://leap:${MONGO_ROOT_PASSWORD:-leapsecret}@mongodb:27017/leapai?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      MFA_CODE_SECRET: ${MFA_CODE_SECRET:-dev-mfa-secret-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,https://leapai.ai,https://leapai-webhook.bab.solutions}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@leapai.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ENFORCE_PROD_SECRETS: ${ENFORCE_PROD_SECRETS:-false}
      SEED_ON_START: ${SEED_ON_START:-true}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-info@leapai.ai}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-info@leapai.ai}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-LeapAI Website <info@leapai.ai>}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /backend
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://leapai.ai}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-GTM-NC7WPDNV}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-7NWB9C7RNB}
        API_URL: http://backend:4000
    container_name: leap-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: /backend
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
      API_URL: http://backend:4000
      INTERNAL_API_URL: http://backend:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://leapai.ai}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-GTM-NC7WPDNV}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-7NWB9C7RNB}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
  uploads_data:
