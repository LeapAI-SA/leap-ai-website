# Nginx — LeapAI at https://leapai.ai (domain root)
# Upstream is Docker frontend on host port 3000.
#
# TLS MUST cover BOTH names or browsers show ERR_CERT_COMMON_NAME_INVALID on www:
#   leapai.ai
#   www.leapai.ai
#
# Expand / renew (on the Ubuntu host):
#   sudo bash deploy/fix-www-ssl.sh
# Or manually:
#   sudo certbot certonly --nginx -d leapai.ai -d www.leapai.ai --expand --non-interactive --agree-tos -m YOUR@EMAIL
#   sudo nginx -t && sudo systemctl reload nginx
#
# After editing: nginx -t && systemctl reload nginx

# ── HTTP → HTTPS (apex + www) ──
server {
  listen 80;
  listen [::]:80;
  server_name leapai.ai www.leapai.ai;
  return 301 https://leapai.ai$request_uri;
}

# ── www → apex (HTTPS) ──
# Requires a certificate whose SAN includes www.leapai.ai.
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.leapai.ai;

  ssl_certificate     /etc/letsencrypt/live/leapai.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/leapai.ai/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://leapai.ai$request_uri;
}

# ── Apex HTTPS → Next.js (Docker host port 3000) ──
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name leapai.ai;

  ssl_certificate     /etc/letsencrypt/live/leapai.ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/leapai.ai/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
