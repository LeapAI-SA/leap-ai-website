# Nginx — LeapAI at domain root (/)
# Add inside your server { } block for leapai-webhook.bab.solutions
# Replace 127.0.0.1:3000 with your Next.js upstream if different.

# ── Next.js app (GEO files at /llms.txt, /robots.txt, etc. — no subpath) ──
location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
