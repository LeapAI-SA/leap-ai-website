# Nginx — LeapAI at domain root (/)
# Add inside your server { } block for leapai-webhook.bab.solutions
# Replace 127.0.0.1:3000 with your Next.js upstream if different.

# ── Next.js app (GEO files at /llms.txt, /robots.txt, etc. — no subpath) ──
location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# ── Legacy URLs (bookmarks / old links under /leap-ai) ──
location = /leap-ai {
  return 301 /;
}

location ^~ /leap-ai/ {
  rewrite ^/leap-ai/(.*)$ /$1 permanent;
}

# Optional: if you previously used deploy/nginx-crawler-root.conf to proxy
# /llms.txt → /leap-ai/llms.txt, remove those rules — the app serves GEO at root now.
