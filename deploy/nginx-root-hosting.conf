# Nginx — LeapAI at https://leapai.ai (domain root)
# Replace certificate paths if needed. Upstream is Docker frontend on host port 3001.
# After editing: nginx -t && systemctl reload nginx

# ── HTTP → HTTPS (apex + www) ──
server {
  listen 80;
  listen [::]:80;
  server_name leapai.ai www.leapai.ai;
  return 301 https://leapai.ai$request_uri;
}

# ── www → apex (HTTPS) ──
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.leapai.ai;

  # ssl_certificate     /etc/letsencrypt/live/leapai.ai/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/leapai.ai/privkey.pem;

  return 301 https://leapai.ai$request_uri;
}

# ── Apex HTTPS → Next.js (Docker host port 3001) ──
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name leapai.ai;

  # ssl_certificate     /etc/letsencrypt/live/leapai.ai/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/leapai.ai/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
